# API pricing — single source of truth for cost calculations.
#
# Used by ``src/boxbot/cost/``. Where the SDK returns a dollar cost
# directly (e.g. claude_agent_sdk ResultMessage.total_cost_usd), that
# value is preferred over recomputing here. This file is the fallback
# for raw API surfaces that only return units (tokens, characters,
# audio seconds).
#
# When prices change: bump ``verified_on`` for the affected provider
# block and update the relevant entry. Historical cost_log rows
# captured the price at write time, so they don't need to change.

anthropic:
  source_url: https://platform.claude.com/docs/en/about-claude/pricing
  verified_on: 2026-09-18
  # Cache and batch multipliers are constant across models per Anthropic
  # docs and are applied in code, not configured here:
  #   cache_read       = 0.10 × input
  #   cache_write_5m   = 1.25 × input
  #   cache_write_1h   = 2.00 × input
  #   batch discount   = 50% off all line items
  models:
    # Claude 5 family (added 2026-08-21; 5.x ids 2026-10-03).
    claude-fable-5-1:
      input_per_mtok: 10.00
      output_per_mtok: 50.00
    claude-fable-5:
      input_per_mtok: 10.00
      output_per_mtok: 50.00
    claude-opus-5-5:
      input_per_mtok: 4.00
      output_per_mtok: 20.00
    claude-sonnet-5-5:
      input_per_mtok: 2.00
      output_per_mtok: 10.00
    claude-opus-5:
      input_per_mtok: 5.00
      output_per_mtok: 25.00
    claude-sonnet-5:
      # $2/$10 launched as intro pricing through 2026-08-31; Anthropic made
      # it the standard rate (the 2026-09-01 increase to $3/$15 was cancelled).
      input_per_mtok: 2.00
      output_per_mtok: 10.00
    claude-opus-4-7:
      input_per_mtok: 5.00
      output_per_mtok: 25.00
    claude-opus-4-8:
      input_per_mtok: 5.00
      output_per_mtok: 25.00
    claude-sonnet-4-6:
      input_per_mtok: 3.00
      output_per_mtok: 15.00
    claude-sonnet-4-20250514:
      input_per_mtok: 3.00
      output_per_mtok: 15.00
    claude-haiku-4-5:
      input_per_mtok: 1.00
      output_per_mtok: 5.00
    claude-haiku-4-5-20251001:
      input_per_mtok: 1.00
      output_per_mtok: 5.00

openai:
  source_url: https://developers.openai.com/api/docs/models/gpt-6-luna
  verified_on: 2026-09-22
  # OpenAI's cached-input discount is per-model (not the constant 0.10×
  # Anthropic applies), so it is an explicit optional per-model rate:
  # ``cached_input_per_mtok``. Models without it bill cached tokens at
  # the full input rate (over-counts, never under). No batch multiplier
  # for the same reason.
  models:
    gpt-5.6-luna:
      # Released 2026-07-09 at $1.00/$6.00; 80% cut on 2026-07-30.
      input_per_mtok: 0.20
      output_per_mtok: 1.20
      # 90% cached-input discount per the model page ($0.02/Mtok). Was 0.05
      # (a 75% operator estimate, 2026-08-28) until verified 2026-09-18.
      cached_input_per_mtok: 0.02
    gpt-6-luna:
      # Released 2026-09-22 (snapshot gpt-6-luna-2026-09-22). Half the
      # 5.6 input rate, ~40% of its output rate; cached input 90% off.
      input_per_mtok: 0.10
      output_per_mtok: 0.50
      cached_input_per_mtok: 0.01

elevenlabs:
  source_url: https://elevenlabs.io/pricing/api
  verified_on: 2026-09-18
  # TTS billed per input character, API list price (same at every tier on
  # the API pricing page): Flash / Turbo $0.05 per 1k chars, Multilingual v2
  # and v3 $0.10 per 1k. Earlier values here were half this (0.5 cr/char at
  # $0.00005/credit — a subscription-credit rate, not the API rate).
  tts:
    eleven_turbo_v2_5:
      dollars_per_char: 0.0000500
    eleven_flash_v2_5:
      dollars_per_char: 0.0000500
    eleven_multilingual_v2:
      dollars_per_char: 0.0001000
    eleven_v3:
      dollars_per_char: 0.0001000
  # STT (Scribe) billed per minute of input audio. Standard ≈ $0.22/hr,
  # realtime ≈ $0.39/hr.
  stt:
    scribe_v2:
      dollars_per_minute: 0.003667
    scribe_v2_realtime:
      dollars_per_minute: 0.006500
